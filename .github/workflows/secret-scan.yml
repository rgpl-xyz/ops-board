# Scans every commit of the history for secrets on each pull request and each push to main. It holds no secret and
# reads only the repository; the action is a GitHub-owned one pinned by commit SHA, with its release in the comment.
name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  history-scan:
    name: History scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Every commit, so a secret removed in a later commit still fails the scan.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Gitleaks from its pinned image, with no secrets and no license key.
      - run: scripts/gitleaks.sh git
