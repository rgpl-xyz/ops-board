name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Create environment file
        run: cp .env.example .env

      - name: Create development certificate
        run: dotnet dev-certs https

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore backend
        run: dotnet restore OpsBoard.sln

      - name: Build backend
        run: dotnet build OpsBoard.sln --no-restore

      - name: Backend unit tests
        run: dotnet test tests/OpsBoard.UnitTests/OpsBoard.UnitTests.csproj --no-build

      - name: Backend integration tests
        run: dotnet test tests/OpsBoard.IntegrationTests/OpsBoard.IntegrationTests.csproj --no-build

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Frontend unit tests
        working-directory: apps/web
        run: npm test

      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install browser and system dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Browser journeys and accessibility checks
        working-directory: apps/web
        run: npm run test:e2e

      - name: Build container images
        run: docker compose build

      - name: Start container stack on an empty database
        run: |
          docker compose down -v
          docker compose up -d --wait

      - name: Container stack check
        run: ./scripts/check-stack.sh

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop container stack
        if: always()
        run: docker compose down -v
