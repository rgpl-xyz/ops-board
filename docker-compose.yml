x-api-image: &api-image
  build:
    context: .
    dockerfile: src/OpsBoard.Api/Dockerfile
  image: opsboard-api
  pull_policy: build

x-connection: &connection "Host=postgres;Port=5432;Database=${POSTGRES_DB:-opsboard};Username=${POSTGRES_USER:-opsboard};Password=${POSTGRES_PASSWORD:-opsboard};GSS Encryption Mode=Disable"

services:
  postgres:
    image: postgres:17-alpine
    container_name: opsboard-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsboard}
      POSTGRES_USER: ${POSTGRES_USER:-opsboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - opsboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsboard} -d ${POSTGRES_DB:-opsboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The services below form a demonstration stack: `docker compose up -d --wait`
  # applies the schema, seeds the Acme Cloud demo data and returns once the
  # application answers. `docker compose up -d postgres` still starts only the
  # database for local development.

  # One-shot schema and seed step. The demo seed refuses to run outside
  # Development, which is why this step, and only this step, uses it.
  migrator:
    <<: *api-image
    entrypoint:
      - /bin/sh
      - -c
      - ./efbundle --connection "$$ConnectionStrings__OpsBoard" && dotnet OpsBoard.Api.dll --seed-demo
    environment:
      ConnectionStrings__OpsBoard: *connection
      ASPNETCORE_ENVIRONMENT: Development
      Demo__Enabled: "true"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    environment:
      ConnectionStrings__OpsBoard: *connection
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      # The runtime image has no HTTP client, so bash opens the socket itself.
      test:
        - CMD
        - bash
        - -c
        - |-
          exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: opsboard-web
    pull_policy: build
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s

volumes:
  opsboard_pgdata:
