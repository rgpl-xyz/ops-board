<dialog
  #dialog
  class="palette"
  aria-labelledby="palette-title"
  aria-describedby="palette-help"
  (cancel)="onCancel($event)"
  (close)="onDialogClose()"
>
  <div class="palette__head">
    <h2 class="palette__title" id="palette-title">Command menu</h2>
    <button type="button" class="palette__close" (click)="close('dismiss')">
      Close
    </button>
  </div>

  <p class="palette__help" id="palette-help">
    Search commands, incidents, and services.
  </p>

  <input
    #search
    type="search"
    class="palette__search"
    role="combobox"
    aria-labelledby="palette-help"
    aria-autocomplete="list"
    [attr.aria-expanded]="open()"
    aria-controls="palette-results"
    autocomplete="off"
    [value]="rawQuery()"
    (input)="onQueryInput($event)"
  />

  <ul
    id="palette-results"
    class="palette__results"
    role="listbox"
    aria-label="Command results"
  ></ul>

  <p class="palette__empty">No matching commands or records</p>

  <p class="palette__hint">&#8593;&#8595; move &middot; Enter open &middot; Esc close</p>
</dialog>
