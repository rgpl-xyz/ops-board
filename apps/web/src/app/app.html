<main class="shell">
  <header class="shell__banner" role="status">
    {{ demoBanner() }}
  </header>

  <div class="shell__body">
    <aside class="shell__nav" aria-label="Primary">
      <p class="shell__brand">OpsBoard</p>
      <p class="shell__hint">Phase 1 scaffold — navigation arrives in Phase 4.</p>
    </aside>

    <section class="shell__content" aria-labelledby="opsboard-heading">
      <h1 id="opsboard-heading">{{ title() }}</h1>
      <p>
        Real-time incident and service operations management. Frontend and API
        scaffolds are compiling; domain features start in Phase 2.
      </p>
      <router-outlet />
    </section>
  </div>
</main>
